name: CI

# Every push and pull request: typecheck, lint, unit tests, end-to-end tests on Linux, then the real Windows x64 installer
# is built, installed silently, started, upgraded, uninstalled and uploaded as the artifact "PetraDMS-Windows-x64-Installer".
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # the installer is unsigned unless signing secrets are added; never try to discover a certificate
  ELECTRON_DISABLE_SECURITY_WARNINGS: '1'

jobs:
  test:
    name: Typecheck, lint, unit and e2e tests (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Electron system libraries
        run: sudo apt-get update && sudo apt-get install -y xvfb libgbm1 libnss3 libasound2t64 libgtk-3-0t64 libxss1 libxtst6
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:unit
      - run: pnpm check:integrity
      - name: Build app bundles
        run: pnpm build
      - name: Environment probe
        run: |
          {
            echo "kernel: $(uname -r)"; echo "os: $(. /etc/os-release; echo $PRETTY_NAME)"
            echo "userns restrict: $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>&1)"
            echo "electron dist: $(find node_modules/.pnpm -maxdepth 4 -type d -path '*electron/dist' | head -2 | tr '\n' ' ')"
            echo "cpus: $(nproc) mem: $(free -m | awk 'NR==2{print $2}')MB"
          } | while read -r l; do echo "::notice title=probe::$l"; done
      - name: End-to-end tests (Playwright driving the real Electron app under xvfb)
        timeout-minutes: 12
        run: xvfb-run -a pnpm exec playwright test --reporter=github,line --max-failures=2
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  windows-installer:
    name: Build and verify Windows x64 installer (NSIS)
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the installer and verify it (install, first run, existing data, offline, upgrade, uninstall)
        run: pnpm verify:package
      - name: Checksum
        shell: pwsh
        run: |
          $exe = Get-ChildItem apps/desktop/release -Filter 'PetraDMS-*-x64.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Installer not produced' }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File -Encoding ascii (Join-Path $exe.DirectoryName 'SHA256SUMS.txt')
          Write-Host "$($exe.Name)  $([math]::Round($exe.Length/1MB,1)) MB  sha256 $hash"
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PetraDMS-Windows-x64-Installer
          path: |
            apps/desktop/release/PetraDMS-*-x64.exe
            apps/desktop/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
