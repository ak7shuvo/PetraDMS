name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, lint, tests (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Electron system libraries
        run: sudo apt-get update && sudo apt-get install -y xvfb libgbm1 libnss3 libasound2t64 libgtk-3-0t64 libxss1 libxtst6
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:unit
      - run: pnpm check:integrity
      - name: Build app bundles
        run: pnpm build
      - name: End-to-end tests (Playwright + Electron under xvfb)
        run: xvfb-run -a pnpm exec playwright test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  windows-installer:
    name: Build Windows x64 installer (NSIS)
    needs: test
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build production installer
        run: pnpm dist:win
      - name: Verify installer exists and is a real production build
        shell: pwsh
        run: |
          $exe = Get-ChildItem apps/desktop/release -Filter 'PetraDMS-Setup-*-x64.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Installer not produced' }
          if ($exe.Length -lt 50MB) { throw "Installer suspiciously small: $($exe.Length) bytes" }
          Write-Host "Installer: $($exe.Name) ($([math]::Round($exe.Length/1MB,1)) MB)"
      - name: Smoke test - silent install and launch packaged app
        shell: pwsh
        run: |
          $exe = Get-ChildItem apps/desktop/release -Filter 'PetraDMS-Setup-*-x64.exe' | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP 'PetraDMS-installed'
          Start-Process -FilePath $exe.FullName -ArgumentList '/S', "/D=$installDir" -Wait
          $app = Join-Path $installDir 'PetraDMS.exe'
          if (-not (Test-Path $app)) { throw "Installed app not found at $app" }
          $env:PETRA_DATA_DIR = Join-Path $env:RUNNER_TEMP 'petra-smoke-data'
          $env:PETRA_SMOKE_OUT = Join-Path $env:RUNNER_TEMP 'smoke.json'
          $p = Start-Process -FilePath $app -ArgumentList '--smoke-test' -Wait -PassThru
          Get-Content $env:PETRA_SMOKE_OUT
          if ($p.ExitCode -ne 0) { throw "Smoke test failed with exit code $($p.ExitCode)" }
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PetraDMS-Windows-x64-Installer
          path: apps/desktop/release/PetraDMS-Setup-*-x64.exe
          if-no-files-found: error
          retention-days: 30
