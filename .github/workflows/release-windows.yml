name: Release Windows installer

# Publishes the NSIS installer as a GitHub Release asset when a version tag is pushed:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Test, build and publish
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:unit
      - run: pnpm check:integrity
      - name: Build production installer
        run: pnpm dist:win
      - name: Smoke test - silent install and launch packaged app
        shell: pwsh
        run: |
          $exe = Get-ChildItem apps/desktop/release -Filter 'PetraDMS-Setup-*-x64.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Installer not produced' }
          $installDir = Join-Path $env:RUNNER_TEMP 'PetraDMS-installed'
          Start-Process -FilePath $exe.FullName -ArgumentList '/S', "/D=$installDir" -Wait
          $app = Join-Path $installDir 'PetraDMS.exe'
          $env:PETRA_DATA_DIR = Join-Path $env:RUNNER_TEMP 'petra-smoke-data'
          $env:PETRA_SMOKE_OUT = Join-Path $env:RUNNER_TEMP 'smoke.json'
          $p = Start-Process -FilePath $app -ArgumentList '--smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Smoke test failed with exit code $($p.ExitCode)" }
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PetraDMS-Windows-x64-Installer
          path: apps/desktop/release/PetraDMS-Setup-*-x64.exe
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem apps/desktop/release -Filter 'PetraDMS-Setup-*-x64.exe' | Select-Object -First 1
          gh release create "${{ github.ref_name }}" $exe.FullName --title "PetraDMS ${{ github.ref_name }}" --generate-notes
